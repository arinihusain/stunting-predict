<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Sistem</title>

    {% include '_theme.html' %}

    <style>
        /* Body aurora comes from theme.css; only card styling lives here. */
        .login-shell {
            background-color: #f4faf8;
        }

        .login-card {
            background: linear-gradient(180deg, rgba(250, 253, 252, 0.9), rgba(250, 253, 252, 0.82));
            backdrop-filter: blur(16px) saturate(1.3);
            -webkit-backdrop-filter: blur(16px) saturate(1.3);
            border: 1px solid rgba(250, 253, 252, 0.6);
            box-shadow: 0 1px 2px rgba(17, 39, 46, 0.04), 0 24px 48px -24px rgba(17, 39, 46, 0.18);
        }

        .login-logo {
            background: linear-gradient(135deg, #0b554f, #0f766e);
            color: #f2fbf9;
            box-shadow: 0 14px 30px -14px rgba(11, 85, 79, 0.6);
        }

        .login-input {
            background-color: #f4faf8;
            border: 1px solid #d8e4e7;
            transition: border-color 140ms ease, box-shadow 140ms ease;
        }

        .login-card input:focus {
            border-color: #32988b;
            box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
        }

        html.dark .login-shell {
            background-color: #0b1412;
        }

        html.dark .login-card {
            background: linear-gradient(180deg, rgba(20, 35, 32, 0.92), rgba(20, 35, 32, 0.82)) !important;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 24px 48px -24px rgba(0, 0, 0, 0.55);
        }

        html.dark .login-input {
            background-color: #16231f !important;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #eef4f2;
        }

        html.dark .login-input::placeholder {
            color: #8ea39c;
        }
    </style>

</head>

<body class="login-shell min-h-screen flex items-center justify-center">

    {% include '_icons.html' %}

    <div class="w-full max-w-md">

        <div class="login-card bg-white rounded-3xl p-10">

            <div class="text-center mb-8">

                <div class="w-20 h-20 mx-auto rounded-3xl login-logo flex items-center justify-center text-4xl mb-4">
                    <svg class="ui-icon"><use href="#icon-stethoscope"></use></svg>
                </div>

                <h1 class="text-3xl font-bold text-slate-800">
                    Login Sistem
                </h1>

                <p class="text-slate-500 mt-2">
                    Sistem Prediksi Stunting
                </p>

            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}

                    <div class="mb-5 p-4 rounded-2xl bg-red-100 text-red-700 text-sm font-medium flex items-start gap-3">
                        <svg class="ui-icon text-base mt-0.5"><use href="#icon-error"></use></svg>
                        <span>{{ message }}</span>
                    </div>

                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" class="space-y-5">

                <div>

                    <label class="block mb-2 text-sm font-medium text-slate-700">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        required
                        class="w-full rounded-2xl border border-slate-200 p-4 focus:ring-4 focus:ring-indigo-100 outline-none"
                    >

                </div>

                <div>

                    <label class="block mb-2 text-sm font-medium text-slate-700">
                        Password
                    </label>

                    <div class="relative">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            class="w-full rounded-2xl border border-slate-200 bg-slate-50 p-4 pr-12 focus:ring-4 focus:ring-indigo-100 outline-none"
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-700 transition"
                            aria-label="Tampilkan password"
                            aria-pressed="false"
                        >
                            <svg class="ui-icon text-lg"><use href="#icon-eye"></use></svg>
                        </button>

                    </div>

                </div>

                <div class="flex items-center mt-4">

                    <input
                        type="checkbox"
                        name="remember"
                        class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-200"
                    >

                    <label class="ml-2 text-sm text-slate-600">

                        Remember Me

                    </label>

                </div>

                <button
                    type="submit"
                    class="w-full bg-indigo-500 hover:bg-indigo-600 transition text-white py-4 rounded-2xl font-semibold shadow-sm hover:shadow-md"
                >
                    Masuk Sistem
                </button>

            </form>

        </div>

    </div>

<script>

const togglePassword = document.getElementById("togglePassword");
const password = document.getElementById("password");

const eyeIcon = '<svg class="ui-icon text-lg"><use href="#icon-eye"></use></svg>';
const eyeOffIcon = '<svg class="ui-icon text-lg"><use href="#icon-eye-off"></use></svg>';

togglePassword.onclick = () => {

    const show = password.type === "password";

    password.type = show ? "text" : "password";

    togglePassword.innerHTML = show ? eyeOffIcon : eyeIcon;

    togglePassword.setAttribute("aria-pressed", String(show));

    togglePassword.setAttribute(
        "aria-label",
        show ? "Sembunyikan password" : "Tampilkan password"
    );

}

</script>
</body>
</html>
