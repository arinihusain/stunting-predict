<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <title>Login Sistem</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: 'Inter', sans-serif;
        }
    </style>

</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-md">

        <div class="bg-white rounded-3xl shadow-sm p-10">

            <div class="text-center mb-8">

                <div class="text-5xl mb-4">
                    🩺
                </div>

                <h1 class="text-3xl font-bold text-slate-800">
                    Login Sistem
                </h1>

                <p class="text-slate-500 mt-2">
                    Sistem Prediksi Stunting
                </p>

            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}

                    <div class="mb-5 p-4 rounded-2xl bg-red-100 text-red-700">
                        {{ message }}
                    </div>

                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" class="space-y-5">

                <div>

                    <label class="block mb-2 text-sm font-medium">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="w-full rounded-2xl border border-slate-200 p-4 focus:ring-4 focus:ring-indigo-100 outline-none"
                    >

                </div>

                <div>

                    <label class="block mb-2 text-sm font-medium">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="w-full rounded-2xl border border-slate-200 p-4 focus:ring-4 focus:ring-indigo-100 outline-none"
                    >

                </div>

                <button
                    type="submit"
                    class="w-full bg-indigo-500 hover:bg-indigo-600 transition text-white py-4 rounded-2xl font-semibold"
                >
                    Masuk Sistem
                </button>

            </form>

        </div>

    </div>

</body>
</html>
