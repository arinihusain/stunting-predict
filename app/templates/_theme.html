<!-- Typography and the warm cream/ink/gold color system. Loaded from base.html <head>. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
    /* Semantic ramps: templates reference gold/ink/cream and the risk/safe
       status tones. Nothing aliases Tailwind's own colour names any more. */
    const GOLD = {
        50: '#fdf8e9', 100: '#faf0c9', 200: '#f3dd8e',
        300: '#eec863', 400: '#f0c53e', 500: '#f4c430',
        600: '#d9a916', 700: '#b6890f', 800: '#8f6b0f', 900: '#6b4f0c'
    };
    const INK = {
        50: '#f7f4ec', 100: '#f0ebdf', 200: '#e4dcc9',
        300: '#d1c6ab', 400: '#a89c81', 500: '#8a7d63',
        600: '#6b604a', 700: '#4f4636', 800: '#241f19', 900: '#15130f'
    };

    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    gold: GOLD,
                    ink: INK,
                    cream: { 50: '#fffdf8', 100: '#f6f2ea', 200: '#efe9dc' },
                    /* Status tones. Never reach for Tailwind's own amber or emerald
                       ramps: they are un-themed and cannot follow dark mode. */
                    risk: { 50: '#fffbeb', 100: '#fef3c7', 400: '#fbbf24', 500: '#f59e0b', 700: '#b45309' },
                    safe: { 50: '#ecfdf5', 100: '#d1fae5', 400: '#34d399', 500: '#10b981', 700: '#047857' }
                },
                fontFamily: {
                    display: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                    body: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
                },
                borderRadius: { card: '1.75rem', pill: '9999px' },
                boxShadow: { card: 'var(--shadow-card)', 'card-lg': 'var(--shadow-card-lg)' },
                keyframes: {
                    fadeIn: {
                        from: { opacity: 0, transform: 'translateY(12px)' },
                        to: { opacity: 1, transform: 'translateY(0)' }
                    }
                },
                animation: { fadeIn: 'fadeIn .28s cubic-bezier(.2,.8,.2,1) both' }
            }
        }
    };
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css', v=asset_v) }}">
